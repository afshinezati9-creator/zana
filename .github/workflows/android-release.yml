name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          set -e
          flutter create . --platforms=android --project-name zana || true
          rm -f android/build.gradle.kts android/app/build.gradle.kts android/settings.gradle.kts

          mkdir -p android/gradle/wrapper android/app
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip' \
            > android/gradle/wrapper/gradle-wrapper.properties

          if [ -f android/settings.gradle ]; then
            sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.11.1"/g' android/settings.gradle || true
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/g' android/settings.gradle || true
          fi

          if [ ! -f android/app/upload-keystore.jks ] && [ -f keys/zana-release.jks ]; then
            cp keys/zana-release.jks android/app/upload-keystore.jks
          fi

          if [ ! -f android/key.properties ]; then
            printf '%s\n' \
              'storePassword=ZANA55800510' \
              'keyPassword=ZANA55800510' \
              'keyAlias=zana' \
              'storeFile=upload-keystore.jks' \
              > android/key.properties
          fi

          if [ ! -f android/app/upload-keystore.jks ]; then
            echo "ERROR: upload-keystore.jks missing"
            ls -la android/app keys || true
            exit 1
          fi

          cat > android/app/build.gradle << 'GRADLE'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "ir.zana.app"
              compileSdk = 36
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_17
              }

              defaultConfig {
                  applicationId = "ir.zana.app"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  release {
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                      storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                      storePassword keystoreProperties["storePassword"]
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {}
          GRADLE
          sed -i 's/^          //' android/app/build.gradle

          echo "--- signing check ---"
          ls -la android/app/upload-keystore.jks android/key.properties
          cat android/key.properties

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build release App Bundle (AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zana-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: zana-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
