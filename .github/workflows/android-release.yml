name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: |
          set -e
          flutter create . --platforms=android --project-name zana || true

          # Only Groovy scripts — remove Kotlin DSL that Flutter may drop in
          rm -f android/build.gradle.kts android/app/build.gradle.kts android/settings.gradle.kts

          mkdir -p android/gradle/wrapper android/app

          # Gradle wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'PROP'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip
          PROP
          sed -i 's/^          //' android/gradle/wrapper/gradle-wrapper.properties

          # Root build.gradle WITHOUT evaluationDependsOn(:app)
          cat > android/build.gradle << 'ROOT'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          ROOT
          sed -i 's/^          //' android/build.gradle

          # settings.gradle — AGP 8.9.1 (not AGP 9)
          cat > android/settings.gradle << 'SET'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.9.1" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }

          include ":app"
          SET
          sed -i 's/^          //' android/settings.gradle

          cat > android/gradle.properties << 'GP'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          android.defaults.buildfeatures.resvalues=true
          android.nonTransitiveRClass=true
          android.suppressUnsupportedCompileSdk=36
          GP
          sed -i 's/^          //' android/gradle.properties

          # Restore keystore
          if [ ! -f android/app/upload-keystore.jks ] && [ -f keys/zana-release.jks ]; then
            cp keys/zana-release.jks android/app/upload-keystore.jks
          fi
          if [ ! -f android/key.properties ]; then
            printf '%s\n' \
              'storePassword=ZANA55800510' \
              'keyPassword=ZANA55800510' \
              'keyAlias=zana' \
              'storeFile=upload-keystore.jks' \
              > android/key.properties
          fi
          test -f android/app/upload-keystore.jks
          test -f android/key.properties

          # app/build.gradle signed release
          cat > android/app/build.gradle << 'APP'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              namespace = "ir.zana.app"
              compileSdk = 36
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_17
              }

              defaultConfig {
                  applicationId = "ir.zana.app"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              signingConfigs {
                  release {
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                      storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                      storePassword keystoreProperties["storePassword"]
                  }
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {}
          APP
          sed -i 's/^          //' android/app/build.gradle

          echo "=== android root build.gradle ==="
          cat android/build.gradle
          echo "=== settings plugins ==="
          grep -n "com.android\|kotlin" android/settings.gradle

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build release App Bundle (AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zana-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: zana-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
